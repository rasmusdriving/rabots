<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChannelList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>body { background: var(--ground); } .demo { display: flex; flex-wrap: wrap; gap: var(--space-6); padding: var(--space-5); align-items: flex-start; } .side { width: 264px; } .side-narrow { width: 84px; } .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; } .narrow { justify-content: center; padding: var(--space-1); }</style>
</head>
<body>
<div class="demo">
  <nav class="pb-side side" aria-label="Channels, with one open">
    <div class="pb-side-group"><div class="pb-side-head"><div class="pb-side-title">Channels</div><button class="pb-icon-btn pb-icon-btn-sm" type="button" aria-label="Add a channel" title="Add a channel"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button></div><ul class="list"><li><button class="pb-channel-row" type="button" aria-current="true"><span class="pb-channel-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 3.25h7A1.5 1.5 0 0 1 13 4.75v4.5a1.5 1.5 0 0 1-1.5 1.5H7.75L5 12.75v-2A1.5 1.5 0 0 1 3 9.25v-4.5a1.5 1.5 0 0 1 1.5-1.5Z"/></svg></span><span class="pb-channel-name">Ops - Internal</span><span class="pb-channel-word">on</span></button></li><li><button class="pb-channel-row" type="button" data-off><span class="pb-channel-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 3.25h7A1.5 1.5 0 0 1 13 4.75v4.5a1.5 1.5 0 0 1-1.5 1.5H7.75L5 12.75v-2A1.5 1.5 0 0 1 3 9.25v-4.5a1.5 1.5 0 0 1 1.5-1.5Z"/></svg></span><span class="pb-channel-name">Customer pilots</span><span class="pb-channel-word">off</span></button></li></ul></div>
    <div class="pb-side-group"><div class="pb-side-title">Machines</div><div class="pb-side-line"><span>Mac mini</span><span>this one</span></div></div>
  </nav>
  <nav class="pb-side side" aria-label="No channels yet">
    <div class="pb-side-group"><div class="pb-side-head"><div class="pb-side-title">Channels</div><button class="pb-icon-btn pb-icon-btn-sm" type="button" aria-label="Add a channel" title="Add a channel"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button></div></div>
  </nav>
  <nav class="pb-side side-narrow" aria-label="Where the roster shows faces only">
    <div class="pb-side-group"><div class="pb-side-head" style="justify-content: center"><button class="pb-icon-btn pb-icon-btn-sm" type="button" aria-label="Add a channel" title="Add a channel"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button></div><ul class="list"><li><button class="pb-channel-row narrow" type="button" aria-current="true" aria-label="Ops - Internal: on"><span class="pb-channel-mark" aria-hidden="true" style="display: grid"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 3.25h7A1.5 1.5 0 0 1 13 4.75v4.5a1.5 1.5 0 0 1-1.5 1.5H7.75L5 12.75v-2A1.5 1.5 0 0 1 3 9.25v-4.5a1.5 1.5 0 0 1 1.5-1.5Z"/></svg></span></button></li><li><button class="pb-channel-row narrow" type="button" data-off aria-label="Customer pilots: off"><span class="pb-channel-mark" aria-hidden="true" style="display: grid"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 3.25h7A1.5 1.5 0 0 1 13 4.75v4.5a1.5 1.5 0 0 1-1.5 1.5H7.75L5 12.75v-2A1.5 1.5 0 0 1 3 9.25v-4.5a1.5 1.5 0 0 1 1.5-1.5Z"/></svg></span></button></li></ul></div>
  </nav>
</div>
</body>
</html>
