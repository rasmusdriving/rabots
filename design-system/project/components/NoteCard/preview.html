<!-- @dsCard group="Needs you" height=230 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoteCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<div style="width: 344px; padding: var(--space-4)">
  <section class="pb-card" aria-labelledby="note-title">
    <div class="pb-card-head"><span class="pb-avatar pb-avatar-sm" data-eyes="wide" data-gap="near"><span class="pb-eyes"><i></i><i></i></span></span><b>Onboardings</b> tells you</div>
    <p class="pb-card-title" id="note-title">The Nordvik import ran</p>
    <p class="pb-card-text">All 214 people were added. Two had no email address; they are listed in the onboarding notes.</p>
    <div class="pb-card-actions"><button class="pb-btn pb-btn-sm pb-btn-quiet pb-btn-flush" type="button">Got it</button></div>
  </section>
</div>
</body>
</html>
