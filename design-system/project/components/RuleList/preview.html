<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RuleList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>body { background: var(--surface); }</style>
</head>
<body>
<div class="pb-stage-col">
  <div class="pb-section-head"><span class="pb-section-title">Always allowed</span><span class="pb-saved" data-show>Saved</span></div>
  <ul class="pb-rules">
    <li class="pb-rule"><span class="pb-rule-text"><span class="pb-rule-label">Run commands that start with git status</span><span class="pb-rule-detail">Bash(git status:*)</span></span><button class="pb-btn pb-btn-sm pb-btn-quiet" type="button">Forget</button></li>
    <li class="pb-rule"><span class="pb-rule-text"><span class="pb-rule-label">Read files in Documents</span><span class="pb-rule-detail">Read(~/Documents/**)</span></span><button class="pb-btn pb-btn-sm pb-btn-quiet" type="button">Forget</button></li>
  </ul>
  <p class="pb-section-text">With no rules: "Nothing is always allowed. Inbox asks each time."</p>
</div>
</body>
</html>
