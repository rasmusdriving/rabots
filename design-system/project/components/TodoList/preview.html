<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TodoList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<div style="display: flex; gap: var(--space-6); padding: var(--space-4); align-items: flex-start; flex-wrap: wrap">
  <aside class="pb-plan" aria-label="Kaja's to-do list" style="width: 248px">
    <button type="button" class="pb-plan-head" aria-expanded="true">
      <span class="pb-plan-title">To-do</span><span class="pb-plan-count">3 of 7</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
    </button>
    <div class="pb-plan-body">
      <ol class="pb-plan-steps">
        <li class="pb-plan-step" data-status="completed"><span class="pb-plan-mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 8.5l3 3 6-7" /></svg></span><span class="pb-plan-text">Read the onboarding backlog</span></li>
        <li class="pb-plan-step" data-status="completed"><span class="pb-plan-mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 8.5l3 3 6-7" /></svg></span><span class="pb-plan-text">Check Nordvik</span></li>
        <li class="pb-plan-step" data-status="completed"><span class="pb-plan-mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 8.5l3 3 6-7" /></svg></span><span class="pb-plan-text">Check Lindgren &amp; Co</span></li>
        <li class="pb-plan-step" data-status="inProgress"><span class="pb-plan-mark"></span><span class="pb-plan-text">Check Berg Bygg</span></li>
        <li class="pb-plan-step" data-status="pending"><span class="pb-plan-mark"></span><span class="pb-plan-text">Check Sundsvall Energi</span></li>
        <li class="pb-plan-step" data-status="pending"><span class="pb-plan-mark"></span><span class="pb-plan-text">Check the two new pilots</span></li>
        <li class="pb-plan-step" data-status="pending"><span class="pb-plan-mark"></span><span class="pb-plan-text">Write the summary</span></li>
      </ol>
    </div>
  </aside>
  <div style="width: 360px">
    <div class="pb-plan-chip-row">
      <button type="button" class="pb-plan-chip" aria-expanded="false"><span class="pb-plan-count">3 of 7</span><span class="pb-plan-chip-now">Check Berg Bygg</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
      </button>
    </div>
  </div>
</div>
</body>
</html>
