<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NeedsYouCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<div style="width: 344px; padding: var(--space-4)">
  <div class="pb-card">
    <div class="pb-card-head"><span class="pb-avatar pb-avatar-sm" data-eyes="wide" data-gap="near"><span class="pb-eyes"><i></i><i></i></span></span><b>Onboardings</b> needs a choice</div>
    <p class="pb-card-title">Kickoff date for the new onboarding</p>
    <p class="pb-card-text">Two dates work for everyone invited.</p>
    <div class="pb-card-actions">
      <button class="pb-btn pb-btn-sm" type="button">Tue 17 Nov</button>
      <button class="pb-btn pb-btn-sm" type="button">Thu 19 Nov</button>
      <button class="pb-btn pb-btn-sm pb-btn-quiet" type="button">Later</button>
    </div>
  </div>
</div>
</body>
</html>
