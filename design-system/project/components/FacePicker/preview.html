<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FacePicker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>body { background: var(--surface); }</style>
</head>
<body>
<div class="pb-stage-col">
  <span class="pb-label" id="face">Face</span>
  <div class="pb-faces" role="radiogroup" aria-labelledby="face">
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Round eyes, normal spacing"><span class="pb-avatar" data-eyes="round"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="true" aria-label="Tall eyes, normal spacing"><span class="pb-avatar" data-eyes="tall"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Wide eyes, normal spacing"><span class="pb-avatar" data-eyes="wide"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Square eyes, normal spacing"><span class="pb-avatar" data-eyes="square"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Round eyes, close together"><span class="pb-avatar" data-eyes="round" data-gap="near"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Tall eyes, close together"><span class="pb-avatar" data-eyes="tall" data-gap="near"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Wide eyes, close together"><span class="pb-avatar" data-eyes="wide" data-gap="near"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Square eyes, close together"><span class="pb-avatar" data-eyes="square" data-gap="near"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Round eyes, far apart"><span class="pb-avatar" data-eyes="round" data-gap="far"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Tall eyes, far apart"><span class="pb-avatar" data-eyes="tall" data-gap="far"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Wide eyes, far apart"><span class="pb-avatar" data-eyes="wide" data-gap="far"><span class="pb-eyes"><i></i><i></i></span></span></button>
    <button class="pb-face-pick" type="button" role="radio" aria-checked="false" tabindex="-1" aria-label="Square eyes, far apart"><span class="pb-avatar" data-eyes="square" data-gap="far"><span class="pb-eyes"><i></i><i></i></span></span></button>
  </div>
</div>
</body>
</html>
