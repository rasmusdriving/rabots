<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BotRow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="pb-side-group" style="width: 264px; padding: var(--space-4) var(--space-3)">
  <a class="pb-row" href="#" aria-current="true">
    <span class="pb-avatar" data-eyes="tall" data-state="waiting"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-row-text"><span class="pb-row-name">Kaja</span><span class="pb-row-line">Two things need you</span></span>
    <span class="pb-mark pb-mark-waiting" title="Waiting for you"></span>
  </a>
  <a class="pb-row" href="#">
    <span class="pb-avatar" data-eyes="round" data-gap="far" data-state="working"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-row-text"><span class="pb-row-name">Inbox</span><span class="pb-row-line">Reading new messages</span></span>
    <span class="pb-mark pb-mark-working" title="Working"></span>
  </a>
  <a class="pb-row" href="#">
    <span class="pb-avatar" data-eyes="square" data-state="idle"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-row-text"><span class="pb-row-name">HubSpot tickets</span><span class="pb-row-line">Quiet since 09:40</span></span>
    <span class="pb-mark pb-mark-idle" title="Idle"></span>
  </a>
  <a class="pb-row" href="#">
    <span class="pb-avatar" data-eyes="wide" data-gap="near" data-state="idle"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-row-text"><span class="pb-row-name">Onboardings</span><span class="pb-row-line">Next run Friday 13:00</span></span>
    <span class="pb-mark pb-mark-idle" title="Idle"></span>
  </a>
</div>
</body>
</html>
