<!-- @dsCard group="Bot page" height=420 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FileList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>body { background: var(--surface); } .pb-files { width: 232px; padding: var(--space-5); } ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }</style>
</head>
<body>
<nav class="pb-files" aria-label="Kaja's files">
  <button class="pb-btn pb-btn-sm pb-btn-quiet" type="button" style="align-self: flex-start"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New file</button>
  <div class="pb-files-group">
    <div class="pb-files-title">Memory</div>
    <ul>
      <li><button class="pb-file" type="button"><span class="pb-file-name">Memory index</span><span class="pb-file-path">memory/MEMORY.md</span></button></li>
      <li><button class="pb-file" type="button" aria-current="true"><span class="pb-file-name">customers</span><span class="pb-file-path">memory/topics/customers.md</span></button></li>
      <li><button class="pb-file" type="button"><span class="pb-file-name">meetings</span><span class="pb-file-path">memory/topics/meetings.md</span></button></li>
    </ul>
  </div>
  <div class="pb-files-group">
    <div class="pb-files-title">Skills</div>
    <ul><li><button class="pb-file" type="button"><span class="pb-file-name">weekly-plan</span><span class="pb-file-path">skills/weekly-plan/SKILL.md</span></button></li></ul>
  </div>
</nav>
</body>
</html>
