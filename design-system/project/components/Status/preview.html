<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="pb-stage" style="gap: var(--space-6)">
  <span class="pb-status"><span class="pb-mark pb-mark-idle"></span>Idle</span>
  <span class="pb-status"><span class="pb-mark pb-mark-thinking"><i></i><i></i><i></i></span>Thinking</span>
  <span class="pb-status"><span class="pb-mark pb-mark-working"></span>Working</span>
  <span class="pb-status pb-status-waiting"><span class="pb-mark pb-mark-waiting"></span>Waiting for you</span>
  <span class="pb-status pb-status-blocked"><span class="pb-mark pb-mark-blocked"></span>Blocked</span>
  <span class="pb-status pb-status-done"><span class="pb-mark pb-mark-done"></span>Done</span>
  <span class="pb-status pb-status-done"><span class="pb-mark pb-mark-done"></span>Stopped</span>
</div>
</body>
</html>
