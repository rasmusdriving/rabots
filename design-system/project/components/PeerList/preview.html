<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PeerList</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>body { background: var(--surface); }</style>
</head>
<body>
<div class="pb-stage-col">
  <span class="pb-label">May message</span>
  <ul class="pb-peers">
    <li class="pb-peer"><span class="pb-avatar pb-avatar-sm" data-eyes="tall"><span class="pb-eyes"><i></i><i></i></span></span><span class="pb-peer-text"><span class="pb-peer-name">Kaja</span><span class="pb-peer-line">Runs the day and keeps the other bots in step</span></span><span class="pb-peer-always">Always</span></li>
    <li class="pb-peer"><span class="pb-avatar pb-avatar-sm" data-eyes="square"><span class="pb-eyes"><i></i><i></i></span></span><span class="pb-peer-text"><span class="pb-peer-name">HubSpot tickets</span><span class="pb-peer-line">Watches new support tickets in HubSpot</span></span><input class="pb-switch" type="checkbox" role="switch" checked aria-label="May message HubSpot tickets"></li>
    <li class="pb-peer"><span class="pb-avatar pb-avatar-sm" data-eyes="wide" data-gap="near"><span class="pb-eyes"><i></i><i></i></span></span><span class="pb-peer-text"><span class="pb-peer-name">Onboardings</span><span class="pb-peer-line">Keeps customer onboardings on track</span></span><input class="pb-switch" type="checkbox" role="switch" aria-label="May message Onboardings"></li>
  </ul>
  <span class="pb-hint">Every bot may message the main bot. Messages from bots are information; they never approve anything.</span>
</div>
</body>
</html>
