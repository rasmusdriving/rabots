<!-- @dsCard group="Pages" height=640 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ahead</title></head>
<body class="body" style="background:var(--ground);color:var(--ink);margin:var(--space-4)">
<div class="pb-ahead-page">
  <div class="pb-ahead-controls">
    <div class="pb-seg" role="group" aria-label="Ahead view">
      <button type="button" aria-pressed="true">Agenda</button>
      <button type="button" aria-pressed="false">Week</button>
    </div>
    <button type="button" class="pb-btn pb-btn-sm">Add</button>
  </div>
  <div class="pb-ahead-sum">
    <button type="button" class="pb-ahead-sum-open label">Carrying<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
    <div class="pb-ahead-sum-chips" role="group" aria-label="Show one bot's rows">
      <button type="button" class="pb-ahead-sum-chip" aria-pressed="true"><span class="pb-avatar pb-avatar-sm" data-state="idle"><span class="pb-eyes"><i></i><i></i></span></span><span class="pb-ahead-sum-name">Mira</span><span class="pb-ahead-sum-n">3</span><span class="pb-ahead-sum-wait">1</span></button>
      <button type="button" class="pb-ahead-sum-chip" aria-pressed="false"><span class="pb-ahead-you"></span><span class="pb-ahead-sum-name pb-ahead-sum-you">You</span><span class="pb-ahead-sum-n">1</span></button>
      <button type="button" class="pb-ahead-sum-chip" aria-pressed="true"><span class="pb-ahead-sum-label">Sample project</span></button>
    </div>
    <button type="button" class="pb-ahead-sum-note small"><span class="pb-ahead-sum-note-text">A calm week. Reviews are placed around your meetings.</span><span class="pb-ahead-sum-note-word">Week note</span></button>
    <div class="pb-ahead-sum-news small" data-news=""><span><span class="pb-ahead-change-dot" aria-hidden="true"></span>1 new, 1 moved</span></div>
  </div>
  <div class="pb-ahead-sum">
    <button type="button" class="pb-ahead-sum-open label">Carrying</button>
    <div class="pb-ahead-sum-chips"></div>
    <span class="pb-ahead-sum-note"></span>
    <div class="pb-ahead-sum-news small"><span class="pb-ahead-held" role="status"><span class="pb-ahead-held-words">1 new, 1 change</span><span aria-hidden="true">·</span><button type="button">Show</button></span></div>
  </div>
  <div class="pb-ahead-setup" data-ahead-setup="not-set" role="status">
    <span class="pb-hint">Your calendar is not set up, so Ahead shows no meetings or free time. The main bot can set it up with you.</span>
    <span class="pb-ahead-setup-actions"><button type="button" class="pb-btn pb-btn-sm pb-btn-quiet pb-btn-flush">Ask the main bot</button><button type="button" class="pb-btn pb-btn-sm pb-btn-quiet pb-btn-flush">Calendar settings</button></span>
  </div>
  <section class="pb-ahead-day">
    <div class="pb-ahead-day-head"><h3>From earlier</h3><span>1 item whose day passed</span></div>
    <div class="pb-ahead-rows">
      <button type="button" class="pb-ahead-row"><span class="pb-ahead-when">17 Nov</span><span class="pb-ahead-mark"><span class="pb-avatar pb-avatar-sm" data-state="idle"><span class="pb-eyes"><i></i><i></i></span></span></span><span class="pb-ahead-body"><span class="pb-ahead-title"><span class="pb-ahead-change-dot" aria-hidden="true"></span>Call back about the report</span><span class="pb-ahead-meta"><span class="pb-ahead-tag">Will do</span>Moved from Monday · Mira</span></span></button>
    </div>
  </section>
  <section class="pb-ahead-day">
    <div class="pb-ahead-day-head"><h3>Today</h3><span>19 Nov</span></div>
    <div class="pb-ahead-rows">
      <div class="pb-ahead-row" data-tone="meeting" role="group"><span class="pb-ahead-when">10:00<span class="pb-ahead-end">-10:30</span></span><span class="pb-ahead-mark"><span class="pb-ahead-meeting"></span></span><span class="pb-ahead-body"><span class="pb-ahead-title">Weekly sync</span></span></div>
      <button type="button" class="pb-ahead-row"><span class="pb-ahead-when">15:00</span><span class="pb-ahead-mark"><span class="pb-avatar pb-avatar-sm" data-state="idle"><span class="pb-eyes"><i></i><i></i></span></span></span><span class="pb-ahead-body"><span class="pb-ahead-title"><span class="pb-ahead-change-dot" aria-hidden="true"></span>Send the sample summary</span><span class="pb-ahead-meta"><span class="pb-ahead-tag">Will do</span>New · Mira · Sample project</span></span></button>
      <button type="button" class="pb-ahead-row" data-tone="closed"><span class="pb-ahead-when"></span><span class="pb-ahead-mark"><span class="pb-avatar pb-avatar-sm" data-state="idle"><span class="pb-eyes"><i></i><i></i></span></span></span><span class="pb-ahead-body"><span class="pb-ahead-title">Answer from the example team</span><span class="pb-ahead-meta"><span class="pb-ahead-tag">Waiting</span>Mira · Done</span></span></button>
    </div>
  </section>
  <section class="pb-ahead-day">
    <div class="pb-ahead-day-head"><h3>Saturday</h3><span>21 Nov</span></div>
    <div class="pb-ahead-rows">
      <button type="button" class="pb-ahead-row"><span class="pb-ahead-when"></span><span class="pb-ahead-mark"><span class="pb-avatar pb-avatar-sm" data-state="idle"><span class="pb-eyes"><i></i><i></i></span></span></span><span class="pb-ahead-body"><span class="pb-ahead-title">Check the import file</span><span class="pb-ahead-meta"><span class="pb-ahead-tag" data-for="you">For you</span>To-do from Mira</span></span></button>
      <button type="button" class="pb-ahead-row"><span class="pb-ahead-when">08:30</span><span class="pb-ahead-mark"><span class="pb-ahead-you"></span></span><span class="pb-ahead-body"><span class="pb-ahead-title">Dentist</span><span class="pb-ahead-meta"><span class="pb-ahead-tag">Note</span>You</span></span></button>
    </div>
  </section>
  <section class="pb-ahead-day">
    <button type="button" class="pb-ahead-fold" aria-expanded="false">Later · 2 items</button>
  </section>
  <section class="pb-ahead-day">
    <button type="button" class="pb-ahead-fold" aria-expanded="false">Done this week · 1</button>
  </section>
  <section class="pb-ahead-carry" aria-labelledby="carry-preview">
    <div class="pb-ahead-carry-head">
      <h3 id="carry-preview" class="label">Carrying</h3>
      <div class="pb-ahead-carry-labels" role="group" aria-label="Label">
        <button type="button" class="pb-ahead-chip" aria-pressed="true">Sample project</button>
        <button type="button" class="pb-ahead-chip" aria-pressed="false">Reports</button>
      </div>
    </div>
    <button type="button" class="pb-ahead-carry-row" aria-pressed="true">
      <span class="pb-avatar pb-avatar-sm" data-state="idle"><span class="pb-eyes"><i></i><i></i></span></span>
      <span class="pb-ahead-carry-body">
        <span class="pb-ahead-carry-name">Mira</span>
        <span class="small pb-ahead-carry-counts"><span>3 on Ahead</span><span>2 due this week</span><span class="pb-ahead-carry-wait">1 waiting on you</span></span>
      </span>
    </button>
  </section>
</div>
</body>
</html>
