<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BotAvatar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  body { background: var(--surface); }
  .faces { display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-5); }
  .faces-row { display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: flex-end; }
  .faces figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
  .faces figcaption { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); }
  .faces h3 { margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.01em; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="faces">
  <h3>One bot, six states</h3>
  <div class="faces-row">
    <figure><span class="pb-avatar pb-avatar-xl" data-eyes="tall" data-state="idle"><span class="pb-eyes"><i></i><i></i></span></span><figcaption>Idle</figcaption></figure>
    <figure><span class="pb-avatar pb-avatar-xl" data-eyes="tall" data-state="thinking"><span class="pb-eyes"><i></i><i></i></span></span><figcaption>Thinking</figcaption></figure>
    <figure><span class="pb-avatar pb-avatar-xl" data-eyes="tall" data-state="working"><span class="pb-eyes"><i></i><i></i></span></span><figcaption>Working</figcaption></figure>
    <figure><span class="pb-avatar pb-avatar-xl" data-eyes="tall" data-state="waiting"><span class="pb-eyes"><i></i><i></i></span></span><figcaption>Waiting</figcaption></figure>
    <figure><span class="pb-avatar pb-avatar-xl" data-eyes="tall" data-state="blocked"><span class="pb-eyes"><i></i><i></i></span></span><figcaption>Blocked</figcaption></figure>
    <figure><span class="pb-avatar pb-avatar-xl" data-eyes="tall" data-state="done"><span class="pb-eyes"><i></i><i></i></span></span><figcaption>Done</figcaption></figure>
  </div>
  <h3>Every bot has its own look</h3>
  <div class="faces-row">
    <span class="pb-avatar pb-avatar-lg" data-eyes="tall"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-avatar pb-avatar-lg" data-eyes="round" data-gap="far"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-avatar pb-avatar-lg" data-eyes="square"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-avatar pb-avatar-lg" data-eyes="wide" data-gap="near"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-avatar pb-avatar-lg" data-eyes="round" data-gap="near"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-avatar pb-avatar-lg" data-eyes="tall" data-gap="far"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-avatar pb-avatar-lg" data-eyes="square" data-gap="far"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-avatar pb-avatar-lg" data-eyes="wide"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-avatar" data-eyes="tall"><span class="pb-eyes"><i></i><i></i></span></span>
    <span class="pb-avatar pb-avatar-sm" data-eyes="tall"><span class="pb-eyes"><i></i><i></i></span></span>
  </div>
</div>
</body>
</html>
