<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>body { background: var(--surface); }</style>
</head>
<body>
<div class="pb-stage">
  <button class="pb-btn pb-btn-primary" type="button">Allow once</button>
  <button class="pb-btn" type="button">Always allow</button>
  <button class="pb-btn pb-btn-quiet" type="button">Later</button>
  <button class="pb-btn pb-btn-danger" type="button">Delete bot</button>
  <button class="pb-btn pb-btn-sm" type="button">Open</button>
  <button class="pb-btn pb-btn-primary" type="button" disabled>Sending</button>
</div>
</body>
</html>
