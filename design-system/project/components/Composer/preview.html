<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>body { background: var(--surface); }</style>
</head>
<body>
<div style="max-width: 640px; padding: var(--space-5)">
  <div class="pb-composer">
    <textarea id="composer-text" rows="1" placeholder="Message Kaja" aria-label="Message Kaja"></textarea>
    <div class="pb-composer-bar">
      <button class="pb-icon-btn" type="button" aria-label="Attach pictures or files" title="Attach pictures or files">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      </button>
      <button class="pb-btn pb-btn-sm pb-btn-quiet pb-push" type="button">Opus 5.5 <small>High</small></button>
      <button class="pb-send" type="button" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
      </button>
    </div>
  </div>
</div>
</body>
</html>
