<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connections</title></head>
<body class="body" style="background:var(--surface-overlay);color:var(--ink);margin:var(--space-5)">
<section class="pb-section pb-links">
  <h2 class="pb-section-title">Connections</h2>
  <p class="pb-section-text">Connect with another Pobots so your main bots can ask or tell each other things.</p>
  <div class="pb-link-actions"><button class="pb-btn">Connect to another Pobots</button></div>
  <p class="pb-link-feedback"></p>
  <ul class="pb-link-list">
    <li class="pb-link-row"><div class="pb-link-summary"><h3 class="body-strong">Sam</h3><p class="pb-link-status">Connected</p><p class="pb-hint">Last message Today at 10:03</p></div>
      <div class="pb-link-actions"><button class="pb-btn pb-btn-sm">Pause</button><button class="pb-btn pb-btn-sm">Rename</button><button class="pb-btn pb-btn-sm pb-btn-danger">Remove</button></div></li>
    <li class="pb-link-row"><div class="pb-link-summary"><h3 class="body-strong">Kim</h3><p class="pb-link-status">Waiting for Kim to enter your code</p><p class="pb-hint">No messages yet</p></div>
      <div class="pb-link-actions"><button class="pb-btn pb-btn-sm">Pairing code</button><button class="pb-btn pb-btn-sm">Rename</button><button class="pb-btn pb-btn-sm pb-btn-danger">Remove</button></div></li>
  </ul>
</section>
</body>
</html>
