<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pobots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .panel { fill: var(--surface-raised); }
  .accent { fill: var(--accent); }
  .light { fill: var(--ink); }
  .mid { fill: var(--ink-faint); }
  .warm { fill: var(--amber); }
  .slab { rx: var(--radius-xl); }
  .ripple { fill: none; stroke: var(--ink-faint); stroke-width: 1.5px; }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 112px; line-height: 0.9; font-weight: 600; letter-spacing: -0.035em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 6px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      surface-raised 216x272 bled off the top (a raised surface on the ground: the system's whole idea, largest) · ink pill 176x64 · ink-faint pill 128x48 · accent disc 16 across at the centre of the rings (the one colour, used once) · amber pill 56x32 (it only ever means "waiting", so it stays small) · about 27% of 960x288
  arrangement one tall raised slab with a cairn of three stones beside it, all bottoms on one line space-6 above the edge, space-2 between stones
  pattern     the literal motif row: still water. Four rings at a space-5 pitch around one accent drop, clipped by the slab. "The bots do the moving; the screen stays still."
  scales      slab corner radius-xl; stones are pills (rx half their height: 32, 24, 16); ring radii 24, 48, 72, 96 (space-5 steps); drop radius space-2
-->
<defs><clipPath id="slab"><rect x="24" y="-28" width="216" height="284" rx="28"/></clipPath></defs>
<rect class="panel slab" x="24" y="-28" width="216" height="284" rx="28"/>
<g clip-path="url(#slab)">
  <circle class="ripple" cx="132" cy="144" r="24"/>
  <circle class="ripple" cx="132" cy="144" r="48"/>
  <circle class="ripple" cx="132" cy="144" r="72"/>
  <circle class="ripple" cx="132" cy="144" r="96"/>
  <circle class="accent" cx="132" cy="144" r="8"/>
</g>
<rect class="light" x="272" y="192" width="176" height="64" rx="32"/>
<rect class="mid" x="296" y="136" width="128" height="48" rx="24"/>
<rect class="warm" x="332" y="96" width="56" height="32" rx="16"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Pobots</h1>
  <p class="tag">Calm help from bots that know their job.</p>
</div>
</div>
</body>
</html>
